version: '3.8'

services:
  # ========== MySQL DB ==========
  mysql:
    image: mysql:8.0
    container_name: gift-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: giftdb
      MYSQL_USER: giftuser
      MYSQL_PASSWORD: giftpass
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ========== Flask 백엔드 ==========
  backend:
    build: ./backend
    container_name: gift-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: giftuser
      DB_PASSWORD: giftpass
      DB_NAME: giftdb
    volumes:
      - ./data:/app/data:ro
      - ./backend/app:/app/app
    depends_on:
      mysql:
        condition: service_healthy

  # ========== nginx 프론트엔드 ==========
  frontend:
    build: ./frontend
    container_name: gift-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: